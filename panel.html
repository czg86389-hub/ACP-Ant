<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACP-Ant 控制面板</title>
<style>
:root{color-scheme:dark;
  --bg:#0b1120;--panel:#111a2c;--panel2:#18233a;--panel3:#223049;--line:rgba(148,163,184,.13);--line2:rgba(148,163,184,.24);
  --text:#e2e8f0;--text2:#cbd5e1;--mute:#94a3b8;--faint:#7c8aa0;
  --acc:#22c55e;--acc-ink:#052e16;--acc-soft:rgba(34,197,94,.12);--info:#60a5fa;
  --ok:#22c55e;--warn:#f59e0b;--bad:#f87171;--off:#64748b;--ok-soft:rgba(34,197,94,.12);--warn-soft:rgba(245,158,11,.13);--bad-soft:rgba(248,113,113,.12);
  --r:14px;--r-sm:9px;--shadow:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px -18px rgba(0,0,0,.7);
  --sans:"Fira Sans","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:"Fira Code","JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme: light){:root{color-scheme:light;
  --bg:#f3f6fa;--panel:#fff;--panel2:#f1f5f9;--panel3:#e2e8f0;--line:rgba(15,23,42,.08);--line2:rgba(15,23,42,.15);
  --text:#0f172a;--text2:#334155;--mute:#5b6b80;--faint:#64748b;
  --acc:#15803d;--acc-ink:#fff;--acc-soft:rgba(21,128,61,.09);--info:#2563eb;
  --ok:#16a34a;--warn:#b45309;--bad:#dc2626;--ok-soft:rgba(22,163,74,.1);--warn-soft:rgba(217,119,6,.1);--bad-soft:rgba(220,38,38,.08);
  --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 20px -12px rgba(15,23,42,.16)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 500px at 15% -10%,var(--acc-soft),transparent 60%),var(--bg);color:var(--text);font:14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--info);text-underline-offset:2px}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:34px;padding:0 12px;
  border:1px solid var(--line2);background:var(--panel);color:var(--text);border-radius:var(--r-sm);transition:background .15s,border-color .15s,color .15s,transform .15s;white-space:nowrap}
button:hover{background:var(--panel2);border-color:var(--mute)}
button:active{transform:translateY(1px)}
button.primary{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
button.primary:hover{filter:brightness(1.08);background:var(--acc)}
button.ghost{background:transparent;border-color:transparent;color:var(--text2)}
button.ghost:hover{background:var(--panel2);border-color:var(--line)}
button.icon{width:34px;padding:0}
button.danger{color:var(--bad)}
button.danger:hover{background:var(--bad-soft);border-color:var(--bad)}
button:disabled{opacity:.55;cursor:not-allowed;transform:none}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line2);border-radius:var(--r-sm);padding:9px 11px;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
input[type=checkbox]{width:16px;height:16px;padding:0;accent-color:var(--acc);vertical-align:-3px;margin:0 6px 0 0;cursor:pointer}
textarea{min-height:96px;resize:vertical;font-family:var(--mono);font-size:12.5px}
label{cursor:pointer}
details summary{cursor:pointer;color:var(--mute)}
.mute{color:var(--mute)}.faint{color:var(--faint)}.small{font-size:12px}
.err{color:var(--bad);overflow-wrap:anywhere}
.sp{flex:1}
/* top bar */
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 22px;
  background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#052e16;background:linear-gradient(135deg,#4ade80,#16a34a);box-shadow:0 4px 14px -4px rgba(34,197,94,.55)}
.logo svg.i{width:20px;height:20px;stroke-width:2.2}
.brand-name{font-weight:700;font-size:15px;letter-spacing:.2px;line-height:1.15}
.brand-sub{font-size:11.5px;color:var(--faint);line-height:1.2}
.toolbar{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.divider{width:1px;height:20px;background:var(--line2);margin:0 6px}
main{max-width:1440px;margin:0 auto;padding:22px 22px 40px}
/* pills & badges */
.pill,.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:500;white-space:nowrap;
  background:var(--panel2);border:1px solid var(--line);color:var(--mute)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--off);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.s-ok .dot{background:var(--ok)}.s-warn .dot,.s-rate .dot,.s-quota .dot{background:var(--warn)}.s-verify .dot,.s-error .dot{background:var(--bad)}.s-off .dot{background:var(--off)}
.badge.s-ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.badge.s-warn,.badge.s-rate,.badge.s-quota{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.badge.s-verify,.badge.s-error{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
/* cards & KPI */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--text);border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);border-radius:var(--r);padding:11px 14px;margin-bottom:16px;font-size:13px}
.banner svg.i{color:var(--warn);margin-top:2px}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:26px}
.kpi{display:flex;flex-direction:column;gap:6px;padding:16px 18px}
.kpi-top{display:flex;align-items:center;justify-content:space-between;color:var(--mute);font-size:12.5px;font-weight:500}
.kpi-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc)}
.kpi-val{font-family:var(--mono);font-size:26px;font-weight:600;letter-spacing:-.5px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi-val .sep{color:var(--faint);font-weight:400;margin:0 4px}
.kpi-sub{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kpi-sub button{min-height:26px;padding:0 10px;font-size:12px;margin-left:auto}
.big{font-family:var(--mono);font-size:22px;font-weight:600}
.sec-title{display:flex;align-items:center;gap:10px;margin:0 0 12px}
.sec-title h2{font-size:15px;font-weight:650;margin:0}
.count{font-family:var(--mono);font-size:12px;color:var(--mute);background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:1px 9px}
.hint{font-size:12px;color:var(--faint)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(380px,100%),1fr));gap:16px;margin-bottom:28px;align-items:start}
.grid>*{min-width:0}
.empty{display:flex;align-items:center;gap:12px;color:var(--mute)}
/* account card */
.acc{display:flex;flex-direction:column;gap:14px;transition:border-color .15s,box-shadow .15s}
.acc:hover{border-color:var(--line2)}
.acc.off{opacity:.6}
.acc-head{display:flex;align-items:center;gap:12px}
.avatar{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:15px;text-transform:uppercase;color:var(--acc);background:var(--acc-soft);flex:none}
.acc-id{min-width:0;flex:1}
.acc h3{margin:0;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-meta{font-size:12px;color:var(--faint);margin-top:2px;overflow-wrap:anywhere}
.acc-meta b{font-weight:500;color:var(--text2)}
.acc-status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px}
.row{font-size:12px}
.quota{display:flex;flex-direction:column;gap:12px;padding:12px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px}
.q-head{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);font-weight:500}
.qg{display:flex;flex-direction:column;gap:7px}
.qg-title{font-size:12.5px;font-weight:600;color:var(--text2)}
.qb{display:grid;grid-template-columns:46px minmax(0,1fr) 54px;column-gap:10px;row-gap:1px;align-items:center;font-size:12px}
.qb-l{color:var(--mute)}
.qb-p{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
.qb-r{grid-column:2/4;font-size:11px;color:var(--faint)}
.bar{height:6px;background:var(--panel3);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#16a34a,#4ade80);transition:width .4s ease}
.bar i.mid{background:linear-gradient(90deg,#d97706,#fbbf24)}.bar i.low{background:linear-gradient(90deg,#dc2626,#f87171)}
.stats{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) minmax(0,1fr);gap:8px;margin:0}
.stats div{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.stats dt{font-size:11px;color:var(--faint);white-space:nowrap}
.stats dd{margin:2px 0 0;font-family:var(--mono);font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stats dd.bad{color:var(--bad)}
.lasterr{font-size:12px;background:var(--bad-soft);border-radius:10px;padding:8px 10px;overflow-wrap:anywhere}
.acts{display:flex;flex-wrap:wrap;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.acts button{min-height:30px;padding:0 10px;font-size:12.5px}
.acts button svg.i{width:14px;height:14px}
.acts .danger{margin-left:auto}
.verify{border:1px solid color-mix(in srgb,var(--bad) 50%,transparent);background:var(--bad-soft);border-radius:10px;padding:9px 12px}
.switch{position:relative;width:42px;height:24px;flex:none}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;background:var(--panel3);border-radius:99px;transition:background .2s}
.switch span:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch input:checked+span{background:var(--acc)}
.switch input:checked+span:before{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--info);outline-offset:2px}
/* events */
.events-card{padding:0;overflow:hidden}
.events-head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.events-head h2{font-size:15px;font-weight:650;margin:0}
.events{max-height:380px;overflow:auto}
.ev{display:grid;grid-template-columns:112px minmax(0,220px) minmax(0,1fr);gap:14px;padding:8px 16px;border-bottom:1px solid var(--line);font-size:12.5px;align-items:baseline}
.ev:last-child{border-bottom:0}
.ev:hover{background:var(--panel2)}
.ev .c{font-family:var(--mono);font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.ev .a{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .t{overflow-wrap:anywhere;color:var(--text)}
.ev.warn{box-shadow:inset 3px 0 0 var(--warn)}.ev.warn .t{color:var(--warn)}
.ev.error{box-shadow:inset 3px 0 0 var(--bad)}.ev.error .t{color:var(--bad)}
.ev-empty{padding:18px 16px}
.foot-note{margin-top:18px;font-size:12px;color:var(--faint);display:flex;gap:6px;flex-wrap:wrap;justify-content:space-between}
/* modal */
.mask{position:fixed;inset:0;background:rgba(2,6,23,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-start;justify-content:center;z-index:20;overflow:auto;padding:6vh 14px}
.modal{background:var(--panel);border:1px solid var(--line2);border-radius:16px;width:min(660px,100%);padding:22px 24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.6);animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
.modal h3{margin:0 0 14px;font-size:17px;font-weight:650}
.modal h4{font-size:13.5px;font-weight:650;color:var(--text2);padding-top:14px;border-top:1px solid var(--line)}
.modal h4:first-of-type{border-top:0;padding-top:0}
.modal ol{padding-left:20px;line-height:1.7}
.modal p{line-height:1.6}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.field{margin-top:12px}
.field label{display:block;font-size:12.5px;color:var(--mute);margin-bottom:6px;font-weight:500}
.tabs{display:flex;gap:4px;padding:4px;background:var(--panel2);border:1px solid var(--line);border-radius:11px;margin-bottom:10px}
.tabs button{flex:1;border:0;background:transparent;color:var(--mute);min-height:32px;border-radius:8px}
.tabs button:hover{background:transparent;color:var(--text)}
.tabs button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps span{flex:1;text-align:center;font-size:12px;padding:6px;border-radius:8px;background:var(--panel2);color:var(--mute)}
.steps span.on{background:var(--acc);color:var(--acc-ink);font-weight:600}
code,pre{font-family:var(--mono);font-size:12.5px}
code{overflow-wrap:anywhere}
pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;overflow:auto;white-space:pre-wrap;word-break:break-all;line-height:1.6}
.kv{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:10px;align-items:center;margin-top:8px;padding:8px 10px;background:var(--panel2);border-radius:10px}
.kv button{min-height:28px;padding:0 10px;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:3px 9px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);font-family:var(--mono);font-size:12px;cursor:pointer;transition:border-color .15s}
.chip:hover{border-color:var(--acc);color:var(--acc)}
table th{font-weight:500;padding:6px 4px}
table td{padding:6px 4px}
#toast{position:fixed;right:20px;bottom:20px;z-index:40;display:flex;flex-direction:column;gap:8px}
#toast div{background:var(--panel);border:1px solid var(--line2);border-left:4px solid var(--info);padding:11px 15px;border-radius:10px;max-width:420px;font-size:13px;box-shadow:0 12px 32px -12px rgba(0,0,0,.45);animation:pop .18s ease-out}
#toast div.bad{border-left-color:var(--bad)}#toast div.ok{border-left-color:var(--ok)}
/* login */
.login{max-width:400px;margin:14vh auto;padding:0 16px}
.login .card{padding:28px}
.login .logo{width:44px;height:44px;border-radius:13px;margin-bottom:16px}
.login h2{margin:0 0 6px;font-size:20px}
.login button.primary{width:100%;min-height:40px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line2);border-top-color:currentColor;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:1100px){.summary{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar .ghost .lbl{display:none}.toolbar .ghost{width:34px;padding:0}}
@media (max-width:640px){header{padding:10px 14px}main{padding:16px 14px 32px}.brand-sub{display:none}.grid{grid-template-columns:1fr}.summary{gap:10px}.kpi-val{font-size:22px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stats .tk{grid-column:1/-1;order:-1}
  .ev{grid-template-columns:auto minmax(0,1fr);row-gap:2px}.ev .t{grid-column:1/-1}.kv{grid-template-columns:1fr auto}.kv>span:first-child{grid-column:1/-1}.modal{padding:18px}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="loginView" class="login" style="display:none">
  <div class="card">
    <div class="logo" data-ic="logo" aria-hidden="true"></div>
    <h2>登录 ACP-Ant</h2>
    <p class="mute small">请输入管理员密码。第一次使用时，初始密码在服务器的 <code>panel-initial-password.txt</code> 里。</p>
    <div class="field"><label for="pw">管理员密码</label><input id="pw" type="password" autocomplete="current-password"></div>
    <div class="field"><button class="primary" id="loginBtn">登录</button></div>
    <p id="loginErr" class="err small" role="alert"></p>
  </div>
</div>

<div id="appView" style="display:none">
  <header>
    <div class="brand"><span class="logo" data-ic="logo" aria-hidden="true"></span><div><div class="brand-name">ACP-Ant</div><div class="brand-sub">Antigravity 网关控制台</div></div></div>
    <span class="pill" id="srvPill" role="status"><span class="dot"></span><span>连接中</span></span>
    <span class="sp"></span>
    <nav class="toolbar" aria-label="面板操作">
      <button class="ghost" data-top="quotaAll" data-ic="refresh" title="刷新全部额度"><span class="lbl">刷新全部额度</span></button>
      <button class="ghost" data-top="proxies" data-ic="globe" title="代理记录"><span class="lbl">代理记录</span></button>
      <button class="ghost" data-top="connect" data-ic="plug" title="接入信息"><span class="lbl">接入信息</span></button>
      <button class="ghost" data-top="test" data-ic="send" title="在线测试"><span class="lbl">在线测试</span></button>
      <button class="ghost" data-top="settings" data-ic="gear" title="设置"><span class="lbl">设置</span></button>
      <span class="divider" aria-hidden="true"></span>
      <button class="icon" data-top="logout" data-ic="logout" title="退出登录" aria-label="退出登录"></button>
      <button class="primary" data-top="add" data-ic="plus">添加账号</button>
    </nav>
  </header>
  <main>
    <div id="banner"></div>
    <section class="summary" id="summary" aria-label="概览"></section>
    <div class="sec-title"><h2>账号池</h2><span class="count" id="accCount">0</span><span class="sp"></span><span class="hint">每 10 秒自动刷新</span></div>
    <div class="grid" id="accounts"></div>
    <section class="card events-card" aria-label="最近事件">
      <div class="events-head"><h2>最近事件</h2><span class="sp"></span><span class="hint">最新在上</span></div>
      <div class="events" id="events"></div>
    </section>
    <div class="foot-note"><span>添加账号后不自动读取额度，点「刷新额度」手动读取（不消耗额度）；定时巡检按设置执行。</span><span>ACP-Ant · 开源项目</span></div>
  </main>
</div>

<div class="mask" id="mask"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let DATA = null, TIMER = null, CONNECT = null;
const ICONS = {
  logo: '<path d="M12 2.5 20.5 7.3v9.4L12 21.5l-8.5-4.8V7.3z"/><path d="M12 8v4l3.5 2"/><path d="M12 12l-3.5 2"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  refresh: '<path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
  plug: '<path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/>',

async function api(path, opt = {}) {
  const r = await fetch("/panel/api" + path, {method: opt.method || (opt.body !== undefined ? "POST" : "GET"),
    headers: {"Content-Type": "application/json", "X-ACP-Panel": "1"}, credentials: "same-origin",
    body: opt.body !== undefined ? JSON.stringify(opt.body) : undefined});
  if (r.status === 401 && path !== "/login") { showLogin(); throw new Error("请先登录"); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || ("请求失败 HTTP " + r.status));
  return d;
}
function toast(msg, kind = "") { const d = document.createElement("div"); d.className = kind; d.textContent = msg; $("#toast").appendChild(d); setTimeout(() => d.remove(), kind === "bad" ? 9000 : 5000); }
function ago(ts) { if (!ts) return "从未"; const s = Math.max(0, Date.now() / 1000 - ts); if (s < 60) return "刚刚"; if (s < 3600) return Math.floor(s / 60) + " 分钟前"; if (s < 86400) return Math.floor(s / 3600) + " 小时前"; return Math.floor(s / 86400) + " 天前"; }
function until(iso) { if (!iso) return ""; const s = (new Date(iso).getTime() - Date.now()) / 1000; if (s <= 0) return "已重置"; if (s < 3600) return Math.ceil(s / 60) + " 分钟后重置"; if (s < 86400) return Math.floor(s / 3600) + " 小时 " + Math.floor(s % 3600 / 60) + " 分后重置"; return Math.floor(s / 86400) + " 天 " + Math.floor(s % 86400 / 3600) + " 小时后重置"; }
function num(n) { n = n || 0; return n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e3 ? (n / 1e3).toFixed(1) + "k" : String(n); }
function clock(ts) { const d = new Date(ts * 1000); return (d.getMonth() + 1) + "-" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") + ":" + String(d.getSeconds()).padStart(2, "0"); }
const GROUP = {"Gemini Models": "Gemini 模型", "Claude and GPT models": "Claude / GPT 模型", "Gemini 4 Argon": "Gemini 4 Argon"};
const WIN = {"weekly": "每周", "5h": "5 小时"};
const KIND = {VERIFY: "需要 Google 验证", QUOTA: "额度用完", RATE_LIMIT: "被限流", UPSTREAM_LIMIT: "上游拒绝(429)", AUTH: "登录失效", BLOCKED: "审核拦截",
  TIMEOUT: "超时", TRANSPORT: "进程断开", BAD_REQUEST: "请求有误", UNKNOWN_MODEL: "模型不存在", SERVER: "服务出错", CONFIG: "配置问题", NO_ACCOUNT: "没有可用账号"};
function kindText(t) { return String(t || "").replace(/^([A-Z_]+):/, (m, k) => (KIND[k] || k) + "："); }

function showLogin() { clearInterval(TIMER); $("#appView").style.display = "none"; $("#loginView").style.display = "block"; setTimeout(() => $("#pw").focus(), 50); }
async function doLogin() {
  $("#loginErr").textContent = "";

  catch (e) { $("#loginErr").textContent = e.message; }
}

$("#pw").onkeydown = e => { if (e.key === "Enter") doLogin(); };

async function start() {

}

}

function quotaHtml(a) {

  if (!a.quota) return '<div class="mute small">尚未读取额度，点击「刷新额度」查看。</div>';
  return a.quota.map(g => '<div class="qg"><div class="qg-title">' + esc(GROUP[g.group] || g.group) + "</div>" + g.buckets.map(b => {
    const p = Math.max(0, Math.min(100, Math.round((b.remaining ?? 0) * 1000) / 10));
    const cls = p > 50 ? "" : p > 20 ? "mid" : "low";
    const w = WIN[b.window] || b.name || b.window;
    return '<div class="qb" title="' + esc(b.description) + '"><span class="qb-l">' + esc(w) +
      '</span><span class="bar" role="progressbar" aria-label="' + esc(w + " 剩余额度") + '" aria-valuenow="' + p + '" aria-valuemin="0" aria-valuemax="100"><i class="' + cls + '" style="width:' + p + '%"></i></span><span class="qb-p">' + p + "%</span>" +

}

    '<div style="overflow:auto;max-height:' + (compact ? "220px" : "60vh") + '"><table style="width:100%;border-collapse:collapse;font-size:12.5px">' +

      '<td style="padding:5px 4px;word-break:break-all"><code>' + esc(r.proxy) + "</code>" + (r.shared_with.length ? '<div class="small">也被 ' + esc(r.shared_with.join("、")) + " 用过</div>" : "") + "</td>" +

let UPD_TIMER = null;
async function updateModal() {
  let u;
  try { u = await api("/update"); } catch (e) { toast(e.message, "bad"); return; }
  const busyNow = u.state === "running" || u.state === "restarting";
  openModal("<h3>版本更新</h3>" +
    '<p class="small">当前版本 <b>v' + esc(u.current) + "</b>" + (u.latest ? " · GitHub 最新 <b>v" + esc(u.latest) + "</b>" : "") +
    (u.checked_at ? ' <span class="mute">（' + esc(ago(u.checked_at)) + "检查）</span>" : "") + "</p>" +
    (u.error ? '<p class="small err">' + esc(u.error) + "</p>" : "") +
    (u.available ? notesHtml(u.notes) : (u.latest ? '<p class="small" style="color:var(--ok)">已经是最新版本。</p>' : "")) +
    (u.available && !busyNow ? (u.can_apply ? '<p class="small mute">「立即更新」会从 GitHub 拉取最新代码、装好依赖，等正在处理的请求做完后自动重启网关（一般 1 分钟内）。账号、密钥、面板密码和统计都保留。</p>' : manualHtml(u)) : "") +
    '<pre class="small" id="updLog" style="max-height:220px;overflow:auto;white-space:pre-wrap;display:' + (u.log ? "block" : "none") + '">' + esc(u.log || "") + "</pre>" +
    '<div class="foot"><button id="updCheck">立即检查</button>' + (u.available && u.can_apply && !busyNow ? '<button class="primary" id="updApply">立即更新</button>' : "") +
    '<button onclick="closeModal()">关闭</button></div>');
  $("#updCheck").onclick = async e => { try { await busy(e.target, () => api("/update/check", {body: {}})); await refresh(); updateModal(); } catch (err) { toast(err.message, "bad"); } };
  if ($("#updApply")) $("#updApply").onclick = async e => {
    if (!confirm("现在更新到 v" + u.latest + "？更新完网关会自动重启一次。")) return;
    try { await busy(e.target, () => api("/update/apply", {body: {}})); followUpdate(u.current); } catch (err) { toast(err.message, "bad"); }
  };
  if (busyNow) followUpdate(u.current);
}
function followUpdate(fromVersion) {
  clearInterval(UPD_TIMER);
  const t0 = Date.now();
  UPD_TIMER = setInterval(async () => {
    try {
      const u = await api("/update");
      const log = $("#updLog");
      if (log) { log.style.display = "block"; log.textContent = u.log || "正在开始…"; log.scrollTop = log.scrollHeight; }
      if (u.current !== fromVersion) { clearInterval(UPD_TIMER); toast("已更新到 v" + u.current, "ok"); closeModal(); refresh(); return; }
      if (u.state === "failed") { clearInterval(UPD_TIMER); toast("更新失败，网关还在用 v" + fromVersion + "（看窗口里的日志）", "bad"); }
    } catch (e) { const log = $("#updLog"); if (log) log.textContent += "\n…网关正在重启"; }
    if (Date.now() - t0 > 20 * 60 * 1000) clearInterval(UPD_TIMER);
  }, 2500);
}

  $("#stUpdSave").onclick = async e => { try { await busy(e.target, () => api("/settings", {body: {update_check: $("#stUpd").checked}})); toast("已保存", "ok"); refresh(); } catch (err) { toast(err.message, "bad"); } };
  $("#stUpdOpen").onclick = () => updateModal();
  $("#stPerSave").onclick = async e => { try { await busy(e.target, () => api("/settings", {body: {per_account: +$("#stPer").value}})); toast("已保存，立即生效", "ok"); closeModal(); refresh(); } catch (err) { toast(err.message, "bad"); } };
  $("#pwSave").onclick = async e => { try { await busy(e.target, () => api("/password", {body: {old: $("#pwOld").value, new: $("#pwNew").value}})); toast("密码已修改，其它设备上的登录已退出", "ok"); closeModal(); refresh(); } catch (err) { toast(err.message, "bad"); } };
}

api("/overview").then(() => start()).catch(() => showLogin());
</script>
</body>
</html>
